# A generic, single database configuration for Alembic.

[alembic]
# Path to migration script directory
script_location = alembic

# Template used to generate migration files
file_template = %%(rev)s_%%(slug)s

# sys.path path, inserted to sys.path if present.
# Defaults to the current working directory.
prepend_sys_path = .

# Timezone to use when rendering the date within the migration file
# timezone = UTC

# sqlalchemy.url is dynamically overridden in alembic/env.py from app.core.config.settings
sqlalchemy.url = postgresql://user:password@localhost:5432/neondb

[post_write_hooks]

[logging]
default_handler_name = console

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
